<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mobanja — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body { font-family: system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-4xl font-bold text-blue-600">mobanja Dashboard</h1>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl">Logout</button>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow mb-8">
      <h2 class="text-2xl font-bold mb-6">Add New Employee</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <input id="firstName" placeholder="First Name" class="p-4 border rounded-xl">
        <input id="lastName" placeholder="Last Name" class="p-4 border rounded-xl">
        <input id="password" type="password" placeholder="Password" class="p-4 border rounded-xl">
        <input id="netSalary" type="number" placeholder="Net Salary" class="p-4 border rounded-xl">
        <select id="role" class="p-4 border rounded-xl">
          <option value="employee">Employee</option>
          <option value="hr">HR</option>
        </select>
      </div>

      <button onclick="addEmployee()" 
              class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl text-lg">
        ADD EMPLOYEE
      </button>

      <div id="message" class="mt-6 text-center text-lg font-medium min-h-[30px]"></div>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow">
      <h2 class="text-2xl font-bold mb-6">All Employees</h2>
      <div id="usersTable" class="overflow-x-auto"></div>
    </div>
  </div>

  <script>
    // Supabase Client
    const supabaseUrl = 'https://plrlufhgzfirdqjeqjhv.supabase.co';
    const supabaseKey = 'sb_publishable_hVxITJF0v6WEyp5A7ZNqTA_E9Zy7l3V';
    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = {};

    window.onload = async () => {
      const userStr = sessionStorage.getItem('currentUser');
      if (!userStr) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = JSON.parse(userStr);
      document.getElementById('message').innerHTML = `<span class="text-green-600">Welcome, ${currentUser.firstName || ''} ${currentUser.lastName || ''}</span>`;

      await loadUsersTable();
    };

    async function addEmployee() {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const password = document.getElementById('password').value.trim();
      const netSalary = parseFloat(document.getElementById('netSalary').value) || 0;
      const role = document.getElementById('role').value;

      if (!firstName || !lastName || !password) {
        showMessage("Please fill First Name, Last Name and Password", "red");
        return;
      }

      showMessage("Adding employee...", "blue");

      // Generate next moXXX ID
      const { data: last } = await supabase.from('users').select('id').order('id', { ascending: false }).limit(1).single();
      let nextId = 'mo002';
      if (last && last.id) {
        const num = parseInt(last.id.replace('mo', '')) || 1;
        nextId = `mo${String(num + 1).padStart(3, '0')}`;
      }

      const { error } = await supabase.from('users').insert([{
        id: nextId,
        firstName: firstName,
        lastName: lastName,
        password: password,
        role: role,
        netSalary: netSalary
      }]);

      if (error) {
        console.error(error);
        showMessage("Failed to add employee: " + error.message, "red");
      } else {
        showMessage(`✅ Employee ${nextId} added successfully!`, "green");
        // Clear form
        document.getElementById('firstName').value = '';
        document.getElementById('lastName').value = '';
        document.getElementById('password').value = '';
        document.getElementById('netSalary').value = '';
        await loadUsersTable();
      }
    }

    function showMessage(text, color) {
      const msg = document.getElementById('message');
      msg.innerHTML = `<span class="text-${color}-600">${text}</span>`;
      setTimeout(() => msg.innerHTML = '', 5000);
    }

    async function loadUsersTable() {
      const { data, error } = await supabase.from('users').select('*').order('id');
      if (error) {
        document.getElementById('usersTable').innerHTML = `<p class="text-red-600 p-4">Error loading employees: ${error.message}</p>`;
        return;
      }

      let html = `<table class="w-full border-collapse text-sm">
        <thead><tr class="bg-gray-100">
          <th class="p-3 text-left">ID</th>
          <th class="p-3 text-left">Name</th>
          <th class="p-3 text-left">Role</th>
          <th class="p-3 text-left">Salary</th>
        </tr></thead><tbody>`;

      (data || []).forEach(u => {
        html += `<tr class="border-t">
          <td class="p-3 font-mono">${u.id}</td>
          <td class="p-3">${u.firstName || ''} ${u.lastName || ''}</td>
          <td class="p-3">${u.role}</td>
          <td class="p-3">${u.netSalary || 0}</td>
        </tr>`;
      });

      html += `</tbody></table>`;
      document.getElementById('usersTable').innerHTML = html || '<p class="p-4 text-gray-500">No employees yet.</p>';
    }

    function logout() {
      sessionStorage.removeItem('currentUser');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
